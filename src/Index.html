<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --ink: #1d2330; --muted: #667085; --line: #d9dde5;
    --accent: #2f5bd3; --accent-ink: #fff; --ok: #1f8a4c; --ok-bg: #e7f6ed; --warn: #b54708; --warn-bg: #fef3e2;
    --danger: #c0352b; --danger-bg: #fdecea;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.6 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px 60px; }
  .narrow { max-width: 440px; }
  header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  header.top h1 { font-size: 20px; margin: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
  .card h2 { font-size: 17px; margin: 0 0 12px; }
  label.f { display: block; margin-bottom: 12px; }
  label.f > span { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 4px; }
  input[type=text], input[type=password], textarea, select {
    width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 7px; font: inherit; background: #fff; color: inherit; }
  textarea { resize: vertical; min-height: 90px; }
  /* 아이폰은 16px보다 작은 입력칸을 누르면 화면을 확대하고, 웹 앱 틀 안에서는 터치 위치가 어긋난 채 남을 수 있어 16px로 둡니다. */
  @media (max-width: 820px), (pointer: coarse) { input[type=text], input[type=password], textarea, select { font-size: 16px; } }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }
  button, .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 16px;
    border-radius: 7px; border: 1px solid var(--line); background: #fff; color: var(--ink); font: inherit; font-weight: 500;
    cursor: pointer; text-decoration: none; white-space: nowrap; }
  button:hover { background: #f0f2f6; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.primary:hover { filter: brightness(1.08); }
  button.danger { color: var(--danger); }
  button.small { padding: 4px 10px; font-size: 13px; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row.end { justify-content: flex-end; }
  .muted { color: var(--muted); font-size: 13px; }
  .msg { padding: 10px 12px; border-radius: 7px; margin: 10px 0; font-size: 14px; }
  .msg.err { background: var(--danger-bg); color: var(--danger); }
  .msg.ok { background: var(--ok-bg); color: var(--ok); }
  .msg.warn { background: var(--warn-bg); color: var(--warn); }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 500; }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.wait { background: #eef0f4; color: var(--muted); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .badge.danger { background: var(--danger-bg); color: var(--danger); }
  table.list { width: 100%; border-collapse: collapse; }
  table.list th, table.list td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.list th { font-size: 13px; color: var(--muted); font-weight: 500; }
  table.list tr.click { cursor: pointer; }
  table.list tr.click:hover td { background: #f7f8fb; }
  .table-scroll { overflow-x: auto; }
  .members-edit td { padding: 4px; }
  .members-edit input { padding: 6px 8px; }
  .progress { height: 6px; background: #eef0f4; border-radius: 99px; overflow: hidden; width: 90px; display: inline-block; vertical-align: middle; }
  .progress > i { display: block; height: 100%; background: var(--ok); }
  .hidden { display: none !important; }
  .modal-back { position: fixed; inset: 0; background: rgba(15, 20, 30, .45); display: flex; align-items: flex-start;
    justify-content: center; padding: 40px 16px; overflow-y: auto; z-index: 50; }
  .modal { background: #fff; border-radius: 10px; padding: 20px; width: 100%; max-width: 620px; }
  .modal h2 { margin: 0 0 8px; font-size: 18px; }
  pre.copy { background: #f6f7f9; border: 1px solid var(--line); border-radius: 7px; padding: 10px 12px; white-space: pre-wrap;
    word-break: break-all; font: 13px/1.6 'Noto Sans KR', sans-serif; margin: 6px 0 12px; }
  .pw { font: 700 18px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 2px; }
  .sigpad-wrap { border: 2px dashed var(--line); border-radius: 10px; background: #fff; position: relative; touch-action: none; }
  .sigpad-wrap canvas { display: block; width: 100%; height: 190px; cursor: crosshair; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .sigpad-hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #b3b9c6;
    pointer-events: none; font-size: 15px; }
  .check { display: flex; gap: 8px; align-items: flex-start; margin: 14px 0; font-weight: 500; }
  .check input { width: 20px; height: 20px; margin-top: 2px; }
  .doc-frame { background: #e9ebef; padding: 20px; border-radius: 10px; overflow-x: auto; margin-bottom: 16px; }
  .doc-frame .doc { margin: 0 auto; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #1d2330; color: #fff;
    padding: 10px 18px; border-radius: 8px; z-index: 99; font-size: 14px; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent;
    border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading { padding: 60px 0; text-align: center; color: var(--muted); }
  .flabel { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 4px; }
  .doc-stack { width: 210mm; margin: 0 auto; }
  .type-pick { gap: 8px; margin-bottom: 16px; }
  .type-opt { display: flex; gap: 8px; align-items: center; padding: 9px 14px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  .type-opt:has(input:checked) { border-color: var(--accent); background: #eef2fc; }
  .type-opt input { margin: 0; }
  .badge.type { background: #eef2fc; color: var(--accent); }
  .quorum { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; padding: 10px 12px; margin-top: 10px;
    background: #f6f7f9; border-radius: 8px; font-size: 14px; }
  .quorum b.ok { color: var(--ok); } .quorum b.no { color: var(--danger); } .quorum b.wait { color: var(--warn); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: -4px 0 12px; }
  .vote-box { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 14px 0 4px; }
  .vote-box b { display: block; margin-bottom: 8px; }
  .vote-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .vote-opt { display: flex; gap: 8px; align-items: center; justify-content: center; padding: 12px; border: 2px solid var(--line);
    border-radius: 9px; cursor: pointer; font-weight: 700; font-size: 16px; }
  .vote-opt:has(input:checked) { border-color: var(--accent); background: #eef2fc; color: var(--accent); }
  .vote-opt input { width: 18px; height: 18px; margin: 0; }
</style>

<!-- 회의록 양식 스타일 (화면 미리보기·인쇄·PDF 저장에 함께 쓰입니다) -->

  .doc .foot { margin-top: 6mm; font-size: 8pt; color: #555; text-align: right; }
  .doc.audit h1 { font-size: 14pt; }
  .doc.audit td, .doc.audit th { font-size: 9pt; text-align: center; }
  .doc.audit .hash { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 8pt; word-break: break-all; }
  /* "위 사실을 확인함 ~ 서명표"는 한 덩어리로: 페이지가 모자라면 통째로 다음 쪽으로 넘어갑니다 */
  .doc .sign-block, .doc .sign, .doc .sign tr { break-inside: avoid; page-break-inside: avoid; }

  /* 출력(인쇄·PDF): A4 여백 15mm 안에 맞춤 */

  .print-root .doc + .doc { margin-top: 0; break-before: page; page-break-before: always; }

  .doc.fit3 .sign tr.r-name td, .doc.fit3 .sign tr.r-name th,
  .doc.fit3 .sign tr.r-sig td, .doc.fit3 .sign tr.r-sig th { height: 9mm; }

  @page { size: A4; margin: 15mm; }

<div id="app"><div class="loading"><span class="spinner"></span> 불러오는 중…</div></div>
<div id="print-area"></div>

<script>
  // 브라우저 저장소(관리자 로그인 유지용). 막혀 있어도 동작하도록 메모리로 대체합니다.
  var store = (function () {
    var mem = {};
    return {
      get: function (k) { try { return sessionStorage.getItem(k); } catch (e) { return mem[k] || null; } },
      set: function (k, v) { try { sessionStorage.setItem(k, v); } catch (e) { mem[k] = v; } },
      del: function (k) { try { sessionStorage.removeItem(k); } catch (e) { delete mem[k]; } },
    };
  })();
</script>
<script>
  const BOOT = <?!= boot ?>;
</script>
<script>
(function () {
  'use strict';

  const app = document.getElementById('app');
  const P = BOOT.params || {};

  // 아이폰(사파리)은 '터치를 받을 영역'을 미리 기억해 두는데, 구글 웹 앱 틀 안에서는 화면이 길어진 뒤에도
  // 이 기억이 바로 갱신되지 않아 서명 칸 터치가 먹통이 될 수 있습니다.
  // 처음부터 문서 전체에 터치 감지를 걸어 두고, 서명 칸에서만 스크롤을 막습니다.
  const onPad = (e) => !!(e.target && e.target.closest && e.target.closest('.sigpad-wrap'));
  ['touchstart', 'touchmove'].forEach((t) => document.addEventListener(t, (e) => {
    if (onPad(e) && e.cancelable) e.preventDefault();
  }, { passive: false }));

  /** 화면 배치를 한 번 다시 계산하게 합니다(아이폰이 터치 영역을 새로 잡도록). */
  function nudgeLayout() {
    const d = document.createElement('div');
    d.style.cssText = 'height:1px;width:1px';
    document.body.appendChild(d);
    void document.body.offsetHeight;
    setTimeout(() => { d.remove(); void document.body.offsetHeight; }, 120);
  }
  const state = { adminToken: store.get('adminToken'), member: null };

  // ───── 공통 도우미 ─────
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $all(sel, root) { return Array.from((root || document).querySelectorAll(sel)); }

  function call(action, payload) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler((r) => {
          if (r && r.ok) return resolve(r.data);
          const e = new Error((r && r.error) || '알 수 없는 오류가 발생했습니다.');
          e.code = r && r.code;
          reject(e);
        })
        .withFailureHandler((e) => reject(new Error((e && e.message) || String(e))))
        .api(action, payload || {});
    });
  }

  function toast(text) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = text;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2200);
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e2) { /* 무시 */ }
      ta.remove();
    }
    toast('복사했습니다');
  }

  function showError(where, err) {
    const box = typeof where === 'string' ? $(where) : where;
    if (box) { box.className = 'msg err'; box.textContent = err.message || String(err); }
  }

  async function busy(btn, fn) {
    const old = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> ' + old;
    try { return await fn(); } finally { btn.disabled = false; btn.innerHTML = old; }
  }

  function deviceInfo() {
    const ua = navigator.userAgent || '';
    const os = /iPhone|iPad/.test(ua) ? 'iOS' : /Android/.test(ua) ? 'Android' : /Windows/.test(ua) ? 'Windows'
      : /Mac OS X/.test(ua) ? 'macOS' : /Linux/.test(ua) ? 'Linux' : '기타';
    const br = /SamsungBrowser/.test(ua) ? '삼성 인터넷' : /Edg\//.test(ua) ? 'Edge' : /Whale/.test(ua) ? '웨일'
      : /KAKAOTALK/i.test(ua) ? '카카오톡' : /CriOS|Chrome/.test(ua) ? 'Chrome' : /Safari/.test(ua) ? 'Safari'
      : /Firefox/.test(ua) ? 'Firefox' : '기타';
    return `${os} · ${br} · 화면 ${screen.width}x${screen.height} | ${ua}`.slice(0, 200);
  }

  async function sha256Hex(buf) {
    const d = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(d)).map((b) => b.toString(16).padStart(2, '0')).join('');
  }

  // ───── 회의록 예시 (2026 계약제교원 운영 지침, 경상북도교육청 기준) ─────
  // ○ 표시는 학교 상황에 맞게 고쳐 쓰는 부분입니다.

  /** 안건 첫 줄에서 '공적심사', '추천', '대상자', '심의' 같은 꼬리말을 떼어 의결서 제목을 만듭니다. */
  function awardTitleFrom(agenda) {
    let t = String(agenda || '').split('\n').map((x) => x.trim()).find(Boolean) || '';
    t = t.replace(/^(\d+[.)]\s*|[-·•]\s*)/, '');
    const tail = /(\s*(공적\s*심사|심사|심의|의결|추천|대상자|결과|관련|안건|에\s*관한)|\s+(의|건|및))\s*$/;
    for (let i = 0; i < 10 && tail.test(t); i++) t = t.replace(tail, '');
    return t.trim();
  }

  /** 회의 결과에 '심사 기준:' 또는 '근거: …기준' 줄이 있으면 그것으로, 없으면 제목으로 심사 기준 문장을 만듭니다. */
  function awardCriteriaFrom(title, result) {
    const line = String(result || '').split('\n').map((x) => x.replace(/^\s*[-·•※]?\s*/, '').trim())
      .find((x) => /^(심사\s*기준|근거)\s*[:：]/.test(x) && /기준/.test(x));
    if (line) {
      const c = line.replace(/^(심사\s*기준|근거)\s*[:：]\s*/, '').replace(/[.。]\s*$/, '');
      return /(의거함|따름|의함)$/.test(c) ? c : c + '에 의거함';
    }
    if (!title) return '';
    if (/표창\s*$/.test(title)) return `${title.replace(/\s*표창\s*$/, '')} 교원 표창 및 본교 교원 자체 공적 심사 기준에 의거함`;
    return `${title} 관련 지침 및 본교 교원 자체 공적 심사 기준에 의거함`;
  }

  function orgFrom(school) { return (String(school || '').match(/\S+학교/) || [''])[0]; }
  function gradeFrom(title) {

    back.addEventListener('click', (e) => { if (e.target === back || e.target.closest('[data-close]')) close(); });
    if (onMount) onMount(back, close);
    return close;
  }

  // ───── 회의록 양식 렌더링 ─────
  /**
   * opts.showSignatures: 서명 이미지 표시 여부(관리자 출력용)
   * opts.mySignatureId: 위원 화면에서 본인 서명만 보여줄 때 본인 memberId
   */
  function sigCellFn(opts) {
    return (x) => {
      // 불참 처리된 위원은 서명 칸에 '불참' 또는 사유를 적습니다.
      if (x.absence && !x.signedAt && !x.signed) return `<span class="absent">${esc(x.absence)}</span>`;
      const showImg = x.signature && (opts.showSignatures || x.memberId === opts.mySignatureId);
      if (showImg) return `<img src="${esc(x.signature)}" alt="${esc(x.name)} 서명">`;
      if (opts.markSigned && (x.signed || x.signedAt)) return '<span class="done-mark">서명완료</span>';
      return opts.showPending ? '<span class="pending">미서명</span>' : '';
    };
  }

  /**
   * 불참 표시를 채운 위원 목록. 불참 처리한 사유를 쓰고, 마감된 회의록에서 서명하지 않은 위원은 '불참'으로 둡니다.
   * (아직 서명 받는 중이면 빈칸 그대로)
   */
  function withAbsence(m, members) {
    return members.map((x) => {
      if (x.signedAt || x.signed) return x;
      const a = x.absence || (m.status === 'closed' ? '불참' : '');
      return a === (x.absence || '') ? x : Object.assign({}, x, { absence: a });
    });
  }

  /**
   * 성원·의결 계산. 성원: 재적 위원 절반 이상 참석, 의결: 참석 위원 과반수 찬성.
   * 공적심사는 가/부로, 일반 회의록은 서명(동의)으로 셉니다. 불참 처리된 위원은 참석에서 빠집니다.
   */
  function quorumOf(m, members) {
    members = withAbsence(m, members);
    const total = members.length;
    const absent = members.filter((x) => x.absence && !x.signedAt).length;
    const present = total - absent;
    const signed = members.filter((x) => x.signedAt).length;
    const pending = present - signed;
    const isAward = m.type === AWARD;
    const yes = isAward ? members.filter((x) => x.signedAt && x.vote === '가').length : signed;
    const no = isAward ? members.filter((x) => x.signedAt && x.vote === '부').length : 0;
    const quorumOk = total > 0 && present * 2 >= total;
    const need = Math.floor(present / 2) + 1; // 과반수
    let result;
    if (!quorumOk) result = { text: '성원 미달', cls: 'no' };
    else if (yes >= need) result = { text: isAward ? '가결' : '의결(과반 동의)', cls: 'ok' };
    else if (yes + pending >= need) result = { text: '서명 진행 중', cls: 'wait' };
    else result = { text: isAward ? '부결' : '과반 동의 미달', cls: 'no' };
    return { total, absent, present, signed, pending, yes, no, quorumOk, need, result, isAward };
  }

  function quorumLine(q) {
    return `재적 ${q.total}명 · 참석 ${q.present}명${q.absent ? ` (불참 ${q.absent}명)` : ''} → 성원 ${q.quorumOk ? '충족' : '미달'}`
      + ` · ${q.isAward ? `가 ${q.yes} / 부 ${q.no}` : `동의(서명) ${q.yes}명`}${q.pending ? ` · 미서명 ${q.pending}명` : ''}`
      + ` → ${q.result.text}`;
  }

  /**
   * 표의 모든 칸 너비를 정해 둡니다(합계 100%). 구글의 PDF 변환은 너비가 빠진 칸을 거의 0으로 줄여
   * 글자가 한 자씩 세로로 늘어서므로, 마지막 칸까지 빠짐없이 지정합니다.
   */
  function colgroup(widths) {
    return `<colgroup>${widths.map((w) => `<col style="width:${w}%">`).join('')}</colgroup>`;
  }
  function signCols(n) {
    const first = n > 8 ? 11 : 13;
    const rest = Math.floor((100 - first) / Math.max(n, 1) * 100) / 100;
    return [first].concat(Array.from({ length: n }, () => rest));
  }

  /** 공적심사위원회: 공적심사의결서 + 회의록, 일반: 회의록만 */
  function renderDocs(m, members, opts) {
    return (m.type === AWARD ? renderAward(m, members, opts) : '') + renderDoc(m, members, opts);
  }

  /** 공적심사의결서. 위원 한 번의 서명이 회의록 서명표와 이 표의 '서명' 칸에 함께 들어갑니다. */
  function renderAward(m, members, opts) {
    opts = opts || {};
    members = withAbsence(m, members);
    const a = m.award || defaultAward();
    const noms = (a.nominees && a.nominees.length) ? a.nominees : [{}];
    const sigCell = sigCellFn(opts);
    const vote = (x, v) => (x.vote === v ? '○' : '');
    return `
      <div class="doc award">
        <h1>공적심사의결서</h1>
        <div class="award-org">${esc(a.org)}</div>
        <table class="award-main">
          ${colgroup([15, 11, 11, 16, 9, 9, 29])}
          <tr><th>제목</th><td colspan="6" class="l">${esc(a.title)}</td></tr>
          <tr><th>일시</th><td colspan="6" class="l">${esc(m.datetime)}</td></tr>
          <tr><th>장소</th><td colspan="6" class="l">${esc(m.place)}</td></tr>
          <tr><th>심사 기준</th><td colspan="6" class="l">${esc(a.criteria)}</td></tr>
          <tr><th>심의 내용</th><td colspan="6">${esc(a.decision)}</td></tr>
          <tr><th rowspan="${noms.length + 1}">심의 결과</th>
            <td colspan="2">훈격</td><td>소속</td><td colspan="2">직위</td><td>성명</td></tr>
          ${noms.map((n) => `<tr><td colspan="2">${esc(n.grade)}</td><td>${esc(n.org)}</td>
            <td colspan="2">${esc(n.position)}</td><td>${esc(n.name)}</td></tr>`).join('')}
          <tr><th rowspan="${members.length + 1}">공적심사위원</th>
            <td colspan="2">직 위</td><td>성 명</td><td>가</td><td>부</td><td>서 명</td></tr>
          ${members.map((x) => `<tr><td>${esc(x.role)}</td><td>${esc(x.position)}</td><td>${esc(x.name)}</td>
            <td class="vote">${vote(x, '가')}</td><td class="vote">${vote(x, '부')}</td><td class="sig">${sigCell(x)}</td></tr>`).join('')}
        </table>
        <table class="award-confirm">
          <tr><td class="stmt">${esc(a.statement)}</td></tr>
          <tr><td class="who">확인자: <span>${esc(a.org)}</span> <span>직위(급)</span> <span>${esc(a.confirmerPosition)}</span>
            <span>성명</span> <span>${esc(a.confirmerName)}</span></td></tr>
        </table>
        ${opts.footer ? `<div class="foot">${esc(opts.footer)}</div>` : ''}
      </div>`;
  }

  function renderDoc(m, members, opts) {
    opts = opts || {};
    members = withAbsence(m, members);
    const cols = members.length;
    const sigCell = sigCellFn(opts);
    const row = (cls, label, cell) =>
      `<tr class="${cls}"><th>${label}</th>${members.map((x) => `<td>${cell(x)}</td>`).join('')}</tr>`;
    return `
      <div class="doc">
        <h1>- ${esc(m.title)} -</h1>
        <table class="info">
          ${colgroup([18, 82])}
          <tr><th>일 시</th><td>${esc(m.datetime)}</td></tr>
          <tr><th>장 소</th><td>${esc(m.place)}</td></tr>
          <tr><th>위 원</th><td>${esc(m.committee)}</td></tr>
          <tr class="agenda"><th>안 건</th><td>${esc(m.agenda)}</td></tr>
          <tr class="result-head"><td colspan="2">회의 결과</td></tr>
          <tr class="result"><td colspan="2">${esc(m.result)}</td></tr>
        </table>
        <div class="sign-block">
        <div class="confirm">위 사실을 확인함</div>
        <div class="date">${esc(m.confirmDate)}</div>
        <div class="school">${esc(m.school)}</div>
        <table class="sign">
          ${colgroup(signCols(cols))}
          ${row('r-role', '구분', (x) => esc(x.role))}
          ${row('r-pos', '직위', (x) => esc(x.position))}
          ${row('r-name', '성명', (x) => esc(x.name))}
          ${row('r-sig', '확인서명', sigCell)}
        </table>
        ${opts.footer ? `<div class="foot">${esc(opts.footer)}</div>` : ''}
        </div>
      </div>`;
  }

  const LOG_LABEL = {
    create: '회의록 작성', update: '회의록 수정', 'issue-password': '비밀번호 발급', 'reissue-password': '비밀번호 재발급',
    login: '본인 확인·열람', 'login-fail': '비밀번호 오류', sign: '동의·서명', 'reset-signature': '서명 취소(관리자)',
    close: '서명 마감', reopen: '서명 다시 열기', absence: '불참 처리', 'absence-cancel': '불참 취소', 'auto-close': '자동 마감(전원 서명)', 'save-pdf': 'PDF 원본 저장',
  };

  /** 전자서명 확인 내역(감사추적) 페이지 */
  function renderAudit(m, members, docHash, logs) {
    logs = logs || [];
    members = withAbsence(m, members);
    const byId = {};
    members.forEach((x) => { byId[x.memberId] = x; });
    const firstView = (id) => { const l = logs.find((x) => x.memberId === id && x.action === 'login'); return l ? l.time : ''; };
    const signLog = (id) => logs.filter((x) => x.memberId === id && x.action === 'sign').pop();
    const devOf = (l) => (l && l.detail.split(' / ').pop().split(' | ')[0]) || '-';
    const events = logs.filter((l) => l.action !== 'save-pdf');
    return `
      <div class="doc audit">
        <h1>전자서명 확인 내역 (감사추적)</h1>
        <table style="margin-bottom:4mm">
          ${colgroup([22, 78])}
          <tr><th>문서</th><td style="text-align:left">${esc(m.title)}</td></tr>
          <tr><th>문서번호</th><td style="text-align:left" class="hash">${esc(m.id)}</td></tr>
          <tr><th>작성 / 최종 수정</th><td style="text-align:left">${esc(m.createdAt)} / ${esc(m.updatedAt)}</td></tr>
          <tr><th>문서 확인값(SHA-256)</th><td style="text-align:left" class="hash">${esc(docHash)}</td></tr>
          <tr><th>본인 확인 방법</th><td style="text-align:left">위원별 개별 링크 + 관리자가 발급한 6자리 비밀번호 (5회 오류 시 잠금)</td></tr>
          <tr><th>성원·의결</th><td style="text-align:left">${esc(quorumLine(quorumOf(m, members)))}
            <span style="font-size:8pt;color:#555">(성원: 재적 절반 이상 참석, 의결: 참석 위원 과반수 ${m.type === AWARD ? '찬성' : '동의'})</span></td></tr>
          <tr><th>서명 방식</th><td style="text-align:left">내용 확인·동의 및 전자서명 사용 동의 후 서명 이미지 입력${m.type === AWARD
            ? ' (공적심사위원회: 위원별 가/부 의결 후 1회 서명, 공적심사의결서와 회의록에 같은 서명 표시)' : ''}</td></tr>
        </table>
        <table>
          ${colgroup(m.type === AWARD ? [7, 9, 9, 6, 15, 15, 19, 20] : [7, 10, 10, 16, 16, 20, 21])}
          <tr><th>번호</th><th>구분</th><th>성명</th>${m.type === AWARD ? '<th>의결</th>' : ''}<th>최초 열람</th>
            <th>서명 일시</th><th>서명 기기</th><th>서명 당시 확인값</th></tr>
          ${members.map((x, i) => {
            const sl = signLog(x.memberId);
            const mismatch = x.docHash && x.docHash !== docHash;
            return `<tr><td>${i + 1}</td><td>${esc(x.role)}</td><td>${esc(x.name)}</td>${m.type === AWARD ? `<td>${esc(x.vote || '-')}</td>` : ''}<td>${esc(firstView(x.memberId) || '-')}</td>
              <td>${esc(x.signedAt || (x.absence ? x.absence : '미서명'))}</td><td>${esc(x.signedAt ? devOf(sl) : '-')}</td>
              <td class="hash">${esc(x.docHash ? x.docHash.slice(0, 16) + '…' : '-')}${mismatch ? ' <b>(불일치)</b>' : x.docHash ? ' (일치)' : ''}</td></tr>`;
          }).join('')}
        </table>
        <h1 style="font-size:11pt;text-align:left;margin:6mm 0 2mm">처리 이력</h1>
        <table>
          ${colgroup([22, 18, 14, 46])}
          <tr><th>일시</th><th>처리</th><th>대상</th><th>내용</th></tr>
          ${events.map((l) => `<tr><td>${esc(l.time)}</td><td>${esc(LOG_LABEL[l.action] || l.action)}</td>
            <td>${esc((byId[l.memberId] && byId[l.memberId].name) || (l.memberId ? '-' : '관리자'))}</td>
            <td style="text-align:left;font-size:8pt">${esc(l.action === 'sign' || l.action === 'login' ? devOf(l) : /password|reset-signature|login-fail/.test(l.action) ? '' : l.detail)}</td></tr>`).join('')}
        </table>
        <p style="font-size:8.5pt;color:#555;margin-top:4mm">· 서명 당시 문서 확인값이 위 문서 확인값과 같으면, 위원이 서명한 뒤 회의록 내용이 바뀌지 않았다는 뜻입니다.<br>
        · 구글 드라이브에 저장한 PDF 원본은 '위변조 확인' 페이지(${esc((BOOT.appUrl || '') + '?page=verify')})에 파일을 올려 원본 여부를 확인할 수 있습니다.</p>
      </div>`;
  }

  // ───── 첫 화면 분기 ─────
  function start() {
    if (P.page === 'admin') return adminStart();
    if (P.page === 'verify') return verifyPage();
    if (P.m) return memberStart();
    app.innerHTML = `
      <div class="wrap narrow">
        <div class="card">
          <h2>회의록 전자서명</h2>
          <p class="muted">위원님은 담당자에게 받은 서명 링크로 접속해 주세요.</p>
          <div class="row"><a class="btn" href="${esc((BOOT.appUrl || '') + '?page=admin')}">관리자 페이지</a>
          <a class="btn" href="${esc((BOOT.appUrl || '') + '?page=verify')}">PDF 위변조 확인</a></div>
        </div>
      </div>`;
  }

  function verifyPage() {
    app.innerHTML = `
      <div class="wrap narrow">
        <div class="card">
          <h2>회의록 PDF 위변조 확인</h2>
          <p class="muted" style="margin-top:-6px">이 시스템에서 구글 드라이브에 저장한 회의록 PDF 원본인지 확인합니다.
            파일 내용은 서버로 보내지 않고, 이 기기에서 계산한 확인값(SHA-256)만 비교합니다.</p>
          <label class="f"><span>PDF 파일 선택</span><input type="file" id="file" accept="application/pdf,.pdf"></label>
          <div id="m" class="hidden"></div>
        </div>
      </div>`;
    $('#file').addEventListener('change', async (e) => {
      const f = e.target.files[0];
      const box = $('#m');
      if (!f) return;
      box.className = 'msg'; box.innerHTML = '<span class="spinner"></span> 확인하는 중…';
      try {
        const sha = await sha256Hex(await f.arrayBuffer());
        const r = await call('verifyPdf', { sha256: sha });
        if (r.match) {
          box.className = 'msg ok';
          box.innerHTML = `<b>원본과 일치합니다.</b> 서명 이후 바뀌지 않은 원본 PDF입니다.<br>
            문서: ${esc(r.title)} (${esc(r.school)})<br>확인 날짜: ${esc(r.confirmDate)} · 원본 저장: ${esc(r.createdAt)}
            ${r.purged ? ' · 클라우드 데이터 파기됨' : ''}<br>
            서명: ${r.signers.map((x) => `${esc(x.name)}(${x.vote ? esc(x.vote) + ', ' : ''}${x.signedAt ? esc(x.signedAt) : x.absence ? esc(x.absence) : '미서명'})`).join(', ')}
            <div class="muted" style="margin-top:6px;word-break:break-all">파일 확인값 ${esc(sha)}</div>`;
        } else {
          box.className = 'msg err';
          box.innerHTML = `<b>일치하는 원본이 없습니다.</b> 내용이 바뀌었거나, 이 시스템의 '구글 드라이브에 저장'으로 만든 원본이 아닙니다.
            (인쇄 창에서 만든 PDF는 확인할 수 없습니다.)<div class="muted" style="margin-top:6px;word-break:break-all">파일 확인값 ${esc(sha)}</div>`;
        }
      } catch (err) { showError(box, err); }
    });
  }

  // ═════════════ 관리자 ═════════════
  async function adminStart(message) {
    if (state.adminToken) return adminList();
    app.innerHTML = '<div class="loading"><span class="spinner"></span></div>';
    let status;
    try { status = await call('adminStatus'); } catch (e) {
      app.innerHTML = `<div class="wrap narrow"><div class="msg err">${esc(e.message)}</div></div>`;
      return;
    }
    const setup = !status.hasPassword;
    app.innerHTML = `
      <div class="wrap narrow">
        <div class="card">
          <h2>${setup ? '관리자 비밀번호 만들기' : '관리자 로그인'}</h2>
          ${setup ? '<p class="muted">처음 사용하시네요. 관리자 페이지에 들어올 때 쓸 비밀번호를 정해 주세요(6자 이상).</p>' : ''}
          <form id="f">
            <label class="f"><span>비밀번호</span><input type="password" id="pw" autocomplete="${setup ? 'new-password' : 'current-password'}" required></label>
            ${setup ? '<label class="f"><span>비밀번호 확인</span><input type="password" id="pw2" autocomplete="new-password" required></label>' : ''}
            <div id="m" class="${message ? 'msg warn' : 'hidden'}">${esc(message || '')}</div>
            <button class="primary" style="width:100%">${setup ? '설정하고 시작하기' : '로그인'}</button>
          </form>
          ${setup ? '' : `
          <details style="margin-top:14px">
            <summary class="muted" style="cursor:pointer">비밀번호를 잊으셨나요?</summary>
            <ol class="muted" style="padding-left:20px;margin:8px 0 0">
              <li>이 시스템을 설치한 <b>구글 시트</b>를 열고 <b>확장 프로그램 → Apps Script</b>를 누릅니다.</li>
              <li>왼쪽 <b>⚙ 프로젝트 설정</b> → 맨 아래 <b>스크립트 속성</b>에서 <b>수정</b>을 누릅니다.</li>
              <li><code>ADMIN_PW_HASH</code>, <code>ADMIN_PW_SALT</code> 두 줄을 <b>삭제</b>하고 <b>스크립트 속성 저장</b>을 누릅니다.</li>
              <li>이 페이지를 새로고침하면 새 비밀번호를 만드는 화면이 나옵니다.</li>
            </ol>
            <p class="muted" style="margin:6px 0 0">회의록과 서명 기록은 지워지지 않습니다. 다른 속성(SPREADSHEET_ID 등)은 지우지 마세요.
              시트를 만든 구글 계정으로만 할 수 있습니다.</p>
          </details>`}
        </div>
      </div>`;
    $('#pw').focus();
    $('#f').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const pw = $('#pw').value;
      if (setup && pw !== $('#pw2').value) return showError('#m', new Error('비밀번호 확인이 일치하지 않습니다.'));
      try {
        const r = await busy($('#f button'), () => call(setup ? 'adminSetup' : 'adminLogin', { password: pw }));
        state.adminToken = r.token;
        store.set('adminToken', r.token);
        adminList();
      } catch (e) { showError('#m', e); }
    });
  }

  function adminHeader(title, right) {
    return `<header class="top"><h1>${esc(title)}</h1><div class="row">${right || ''}
      <button class="small" id="chpw">비밀번호 변경</button>
      <button class="small" id="logout">로그아웃</button></div></header>`;
  }
  function bindLogout() {
    const b = $('#logout');
    if (b) b.addEventListener('click', () => { store.del('adminToken'); state.adminToken = null; adminStart(); });
    const c = $('#chpw');
    if (c) c.addEventListener('click', () => modal(`
      <h2>관리자 비밀번호 변경</h2>
      <form id="pwf">
        <label class="f"><span>현재 비밀번호</span><input type="password" id="op" autocomplete="current-password" required></label>
        <label class="f"><span>새 비밀번호 (6자 이상)</span><input type="password" id="np" autocomplete="new-password" required></label>
        <label class="f"><span>새 비밀번호 확인</span><input type="password" id="np2" autocomplete="new-password" required></label>
        <div id="pwm" class="hidden"></div>
        <div class="row end"><button type="button" data-close>취소</button><button class="primary">변경</button></div>
      </form>`, (back, close) => {
      $('#op', back).focus();
      $('#pwf', back).addEventListener('submit', async (ev) => {
        ev.preventDefault();
        if ($('#np', back).value !== $('#np2', back).value) return showError($('#pwm', back), new Error('새 비밀번호 확인이 일치하지 않습니다.'));
        try {
          await busy($('#pwf button.primary', back), () => call('adminChangePassword',
            { token: state.adminToken, oldPassword: $('#op', back).value, newPassword: $('#np', back).value }));
          close();
          toast('비밀번호를 바꿨습니다');
        } catch (err) { if (!handleAuthError(err)) showError($('#pwm', back), err); }
      });
    }));
  }

  async function adminList() {
    app.innerHTML = '<div class="loading"><span class="spinner"></span></div>';
    let list;
    try { list = await call('listMeetings', { token: state.adminToken }); } catch (e) {
      if (!handleAuthError(e)) app.innerHTML = `<div class="wrap"><div class="msg err">${esc(e.message)}</div></div>`;
      return;
    }
    state.meetingList = list;
    app.innerHTML = `
      <div class="wrap">
        ${adminHeader('회의록 전자서명 관리', '<button class="primary" id="new">+ 새 회의록</button>')}
        <div class="card">
          ${list.length === 0 ? '<p class="muted">아직 만든 회의록이 없습니다. <b>+ 새 회의록</b>을 눌러 시작하세요.</p>' : `
          <div class="table-scroll"><table class="list">
            <tr><th>회의록</th><th>확인 날짜</th><th>서명</th><th>상태</th></tr>
            ${list.map((x) => `
              <tr class="click" data-id="${esc(x.id)}">
                <td><b>${esc(x.title)}</b>${x.type === AWARD ? ' <span class="badge type">공적심사</span>' : ''}<div class="muted">${esc(x.datetime)}</div></td>
                <td>${esc(x.confirmDate)}</td>
                <td><span class="progress"><i style="width:${x.total - (x.absent || 0) ? Math.round(x.signed / (x.total - (x.absent || 0)) * 100) : 0}%"></i></span>
                  <span class="muted">${x.signed}/${x.total - (x.absent || 0)}${x.absent ? ` (불참 ${x.absent})` : ''}</span></td>
                <td>${statusBadge(x)}</td>
              </tr>`).join('')}
          </table></div>`}
        </div>
      </div>`;
    bindLogout();
    $('#new').addEventListener('click', () => adminEdit(null));
    $all('tr.click').forEach((tr) => tr.addEventListener('click', () => adminDetail(tr.dataset.id)));
  }

  function statusBadge(x) {
    if (x.status === 'closed') return '<span class="badge wait">마감</span>';
    if (x.total && x.signed === x.total - (x.absent || 0)) return '<span class="badge ok">서명 완료</span>';
    return '<span class="badge warn">서명 받는 중</span>';
  }

  const DEFAULT_MEMBERS = [{ role: '위원장', position: '교감', name: '' }]
    .concat(Array.from({ length: 7 }, () => ({ role: '위원', position: '교사', name: '' })));

  function defaultMeeting() {
    const y = new Date().getFullYear();
    return {
      title: `${y} 인사자문위원회 회의록`, datetime: '', place: '', committee: '인사자문위원회',
      agenda: '', result: '1. 사유: \n\n2. 결과: \n  - ', confirmDate: todayKo(), school: `○○초등학교 ${y} 인사자문위원회`,
      type: '', award: null,
    };
  }

  async function adminEdit(id) {
    let meeting = defaultMeeting();
    let members = DEFAULT_MEMBERS.map((x) => Object.assign({}, x));
    let signedCount = 0;
    if (id) {
      app.innerHTML = '<div class="loading"><span class="spinner"></span></div>';
      try {
        const r = await call('getMeeting', { token: state.adminToken, id });
        meeting = r.meeting; members = r.members;
        signedCount = members.filter((x) => x.signedAt).length;
      } catch (e) { if (!handleAuthError(e)) alert(e.message); return; }
    }
    const others = (state.meetingList || []).filter((x) => x.id !== id);
    app.innerHTML = `
      <div class="wrap">
        ${adminHeader(id ? '회의록 수정' : '새 회의록', '<button class="small" id="back">← 목록</button>')}
        ${signedCount ? `<div class="msg warn">이미 ${signedCount}명이 서명했습니다. 내용이나 위원 명단을 바꾸면 서명이 모두 초기화되고 다시 받아야 합니다.</div>` : ''}
        ${!id && others.length ? `
        <div class="card"><div class="row">
          <span class="muted">이전 회의록에서 불러오기</span>
          <select id="copyFrom" style="width:auto;flex:1;min-width:200px"><option value="">선택하세요</option>
            ${others.map((x) => `<option value="${esc(x.id)}">${esc(x.title)} (${esc(x.confirmDate)})</option>`).join('')}</select>
          <button class="small" id="copyBtn">불러오기</button>
        </div><p class="muted" style="margin:6px 0 0">위원 명단과 기본 정보를 가져옵니다. 비밀번호는 새로 발급됩니다.</p></div>` : ''}
        <form id="f">
          <div class="card">
            <h2>회의 정보</h2>
            <div class="row type-pick">
              <label class="type-opt"><input type="radio" name="mtype" value=""> 일반 회의록</label>
              <label class="type-opt"><input type="radio" name="mtype" value="award"> 공적심사위원회 <span class="muted">(공적심사의결서 + 회의록)</span></label>
            </div>
            <div style="margin:-4px 0 14px">
              <div class="muted" style="margin-bottom:6px">예시 불러오기 <span style="font-weight:400">(2026 계약제교원 운영 지침 기준, ○ 부분을 고쳐 쓰세요)</span></div>
              <div class="row">${TEMPLATES.map((t, i) => `<button type="button" class="small" data-tpl="${i}">${esc(t.label)}</button>`).join('')}</div>
            </div>
            <label class="f"><span>회의록 제목</span><input type="text" name="title" required></label>
            <div class="grid2">
              <label class="f"><span>일시</span><input type="text" name="datetime" placeholder="예: 2026. 9. 15.(수) 13:40~"></label>
              <label class="f"><span>장소</span><input type="text" name="place" placeholder="예: 교무회의실"></label>
            </div>
            <label class="f"><span>위원</span><input type="text" name="committee"></label>
            <label class="f"><span>안건</span><textarea name="agenda" rows="2" style="min-height:60px"></textarea></label>
            <label class="f"><span>회의 결과</span><textarea name="result" rows="12" style="min-height:240px"></textarea></label>
            <div class="grid2">
              <label class="f"><span>확인 날짜 ("위 사실을 확인함" 아래)</span><input type="text" name="confirmDate" placeholder="예: 2026. 10. 10."></label>
              <label class="f"><span>학교·위원회 이름 (날짜 아래 큰 글씨)</span><input type="text" name="school" placeholder="예: ○○초등학교 2026 인사자문위원회"></label>
            </div>
          </div>
          <div class="card hidden" id="awardCard">
            <h2>공적심사의결서</h2>
            <p class="muted" style="margin-top:-6px">회의록 바로 앞 쪽에 출력됩니다. 일시·장소는 회의록과 같고, 제목과 심사 기준은 안건·회의 결과에서 자동으로 만들어집니다(직접 고쳐도 됩니다).
              위원은 서명할 때 가/부를 고르고, 서명 한 번이 의결서와 회의록에 함께 들어갑니다.</p>
            <div class="row" style="margin-bottom:12px"><button type="button" class="small" id="awardAuto">안건·회의 결과에서 다시 만들기</button></div>
            <label class="f"><span>제목</span><input type="text" name="a_title" placeholder="예: 제59회 과학의 날 기념 교육감 표창"></label>
            <label class="f"><span>심사 기준</span><textarea name="a_criteria" rows="2" style="min-height:60px"></textarea></label>
            <label class="f"><span>심의 내용</span><input type="text" name="a_decision"></label>
            <div style="margin-bottom:12px"><span class="flabel">심의 결과 (추천 대상자)</span>
              <div class="table-scroll"><table class="list members-edit">
                <thead><tr><th>훈격</th><th>소속</th><th>직위</th><th>성명</th><th style="width:44px"></th></tr></thead>
                <tbody id="nrows"></tbody>
              </table></div>
              <button type="button" class="small" id="addNom" style="margin-top:6px">+ 대상자 추가</button>
            </div>
            <label class="f"><span>학교명 (오른쪽 위, 확인자 소속)</span><input type="text" name="a_org" placeholder="예: 구미초등학교"></label>
            <label class="f"><span>확인 문구</span><textarea name="a_statement" rows="3" style="min-height:70px"></textarea></label>
            <div class="grid2">
              <label class="f"><span>확인자 직위(급)</span><input type="text" name="a_confirmerPosition"></label>
              <label class="f"><span>확인자 성명</span><input type="text" name="a_confirmerName" placeholder="예: 임지선"></label>
            </div>
          </div>
          <div class="card">
            <h2>위원 명단</h2>
            <p class="muted" style="margin-top:-6px">서명표에 왼쪽부터 이 순서대로 들어갑니다. 저장하면 새로 추가된 위원마다 접속 비밀번호(6자리)가 발급됩니다.</p>
            <div class="table-scroll"><table class="list members-edit">
              <thead><tr><th style="width:40px">#</th><th>구분</th><th>직위</th><th>성명</th><th style="width:110px"></th></tr></thead>
              <tbody id="mrows"></tbody>
            </table></div>
            <button type="button" class="small" id="addRow" style="margin-top:8px">+ 위원 추가</button>
          </div>
          <div id="m" class="hidden"></div>
          <div class="row end">
            <button type="button" id="preview">미리보기</button>
            <button class="primary" id="save">저장</button>
          </div>
        </form>
      </div>`;
    bindLogout();
    $('#back').addEventListener('click', () => (id ? adminDetail(id) : adminList()));

    const form = $('#f');
    const fill = (m) => ['title', 'datetime', 'place', 'committee', 'agenda', 'result', 'confirmDate', 'school']
      .forEach((k) => { form.elements[k].value = m[k] || ''; });
    fill(meeting);

    // ── 회의 종류 / 공적심사의결서 ──
    const el = form.elements;
    const AWARD_KEYS = ['title', 'criteria', 'decision', 'org', 'statement', 'confirmerPosition', 'confirmerName'];
    const nbody = $('#nrows');
    const addNom = (n) => {
      const tr = document.createElement('tr');
      tr.innerHTML = ['grade', 'org', 'position', 'name'].map((k) =>
        `<td><input type="text" data-n="${k}" value="${esc(n[k] || '')}" placeholder="${{ grade: '예: 교육감', org: '소속', position: '직위', name: '성명' }[k]}"></td>`).join('')
        + '<td><button type="button" class="small danger" data-ndel title="삭제">✕</button></td>';
      nbody.appendChild(tr);
    };
    nbody.addEventListener('click', (e) => { if (e.target.closest('[data-ndel]')) e.target.closest('tr').remove(); });
    $('#addNom').addEventListener('click', () => addNom({ org: el.a_org.value.trim(), position: '교사' }));
    const fillAward = (a) => {
      a = Object.assign(defaultAward(), a || {});
      AWARD_KEYS.forEach((k) => { el['a_' + k].value = a[k] || ''; });
      nbody.innerHTML = '';
      (a.nominees && a.nominees.length ? a.nominees : defaultAward().nominees).forEach(addNom);
    };
    const collectAward = () => {
      const a = {};
      AWARD_KEYS.forEach((k) => { a[k] = el['a_' + k].value; });
      a.nominees = $all('tr', nbody).map((tr) => Object.fromEntries($all('[data-n]', tr).map((i) => [i.dataset.n, i.value])));
      return a;
    };
    // 제목·심사 기준을 직접 고치기 전까지는 안건·회의 결과를 따라 자동으로 바뀝니다.
    const auto = { title: !meeting.award, criteria: !meeting.award, org: !meeting.award };
    const syncAward = (force) => {
      if (force || auto.title) el.a_title.value = awardTitleFrom(el.agenda.value);
      if (force || auto.criteria) el.a_criteria.value = awardCriteriaFrom(el.a_title.value.trim(), el.result.value);
      const prevOrg = el.a_org.value.trim();
      if (force || auto.org || !prevOrg) el.a_org.value = orgFrom(el.school.value);
      // 추천 대상자의 소속·훈격도 비어 있거나 자동으로 채운 값이면 따라 바꿉니다.
      $all('tr', nbody).forEach((tr) => {
        const o = $('[data-n=org]', tr);
        if (!o.value.trim() || o.value.trim() === prevOrg) o.value = el.a_org.value.trim();
      });
      const first = $('tr', nbody);
      if (first) {
        const g = $('[data-n=grade]', first);
        if (!g.value.trim() || force) g.value = gradeFrom(el.a_title.value) || g.value;
      }
      if (force) { auto.title = true; auto.criteria = true; auto.org = true; }
    };
    el.a_org.addEventListener('input', () => { auto.org = false; });
    el.a_title.addEventListener('input', () => {
      auto.title = false;
      if (auto.criteria) el.a_criteria.value = awardCriteriaFrom(el.a_title.value.trim(), el.result.value);
    });
    el.a_criteria.addEventListener('input', () => { auto.criteria = false; });
    ['agenda', 'result', 'school'].forEach((k) => el[k].addEventListener('input', () => syncAward(false)));
    $('#awardAuto').addEventListener('click', () => { syncAward(true); toast('안건·회의 결과에서 다시 만들었습니다'); });

    const setType = (type, fromUser) => {
      $all('[name=mtype]').forEach((r) => { r.checked = r.value === type; });
      $('#awardCard').classList.toggle('hidden', type !== AWARD);
      if (!fromUser) return;
      // '인사자문위원회' ↔ '공적심사위원회' 이름을 맞춰 바꿉니다.
      const from = COMMITTEE_NAME[type === AWARD ? '' : AWARD]; const to = COMMITTEE_NAME[type === AWARD ? AWARD : ''];
      ['title', 'committee', 'school'].forEach((k) => { el[k].value = el[k].value.split(from).join(to); });
      if (type === AWARD) syncAward(false);
    };
    fillAward(meeting.award);
    setType(meeting.type === AWARD ? AWARD : '', false);
    $all('[name=mtype]').forEach((r) => r.addEventListener('change', () => setType(r.value, true)));

    const blank = defaultMeeting();
    $all('[data-tpl]').forEach((b) => b.addEventListener('click', () => {
      const t = TEMPLATES[Number(b.dataset.tpl)];
      const touched = (el.agenda.value.trim() && el.agenda.value !== blank.agenda)
        || (el.result.value.trim() && el.result.value !== blank.result);
      if (touched && !confirm(`'${t.label}' 내용으로 안건과 회의 결과를 바꿀까요? 지금 입력한 내용은 지워집니다.`)) return;
      el.agenda.value = t.agenda;
      el.result.value = t.result.join('\n');
      if ((t.type || '') !== el.mtype.value) setType(t.type || '', true);
      if (t.type === AWARD) syncAward(true);
      if (!el.datetime.value.trim()) el.datetime.value = todayWithDay();
      if (!el.place.value.trim()) el.place.value = '교무회의실';
      if (!el.committee.value.trim()) el.committee.value = COMMITTEE_NAME[el.mtype.value] || COMMITTEE_NAME[''];
      if (!el.confirmDate.value.trim()) el.confirmDate.value = todayKo();
      toast(`${t.label}을(를) 불러왔습니다. ○ 부분을 고쳐 주세요`);
      el.result.focus();
    }));

    const tbody = $('#mrows');
    const addRow = (x) => {
      const tr = document.createElement('tr');
      tr.dataset.memberId = x.memberId || '';
      tr.innerHTML = `
        <td class="muted idx"></td>
        <td><input type="text" data-k="role" value="${esc(x.role)}"></td>
        <td><input type="text" data-k="position" value="${esc(x.position)}"></td>
        <td><input type="text" data-k="name" value="${esc(x.name)}" placeholder="성명"></td>
        <td><div class="row" style="flex-wrap:nowrap;gap:2px">
          <button type="button" class="small" data-act="up" title="위로">↑</button>
          <button type="button" class="small" data-act="down" title="아래로">↓</button>
          <button type="button" class="small danger" data-act="del" title="삭제">✕</button></div></td>`;
      tbody.appendChild(tr);
      renumber();
    };
    const renumber = () => $all('tr', tbody).forEach((tr, i) => { $('.idx', tr).textContent = i + 1; });
    members.forEach(addRow);
    $('#addRow').addEventListener('click', () => addRow({ role: '위원', position: '교사', name: '' }));
    tbody.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-act]');
      if (!b) return;
      const tr = b.closest('tr');
      if (b.dataset.act === 'del') tr.remove();
      if (b.dataset.act === 'up' && tr.previousElementSibling) tbody.insertBefore(tr, tr.previousElementSibling);
      if (b.dataset.act === 'down' && tr.nextElementSibling) tbody.insertBefore(tr.nextElementSibling, tr);
      renumber();
    });

    const copyBtn = $('#copyBtn');
    if (copyBtn) copyBtn.addEventListener('click', async () => {
      const src = $('#copyFrom').value;
      if (!src) return;
      try {
        const r = await busy(copyBtn, () => call('getMeeting', { token: state.adminToken, id: src }));
        fill(Object.assign({}, r.meeting, { confirmDate: todayKo() }));
        if (r.meeting.type === AWARD && r.meeting.award) {
          setType(AWARD, false);
          fillAward(r.meeting.award);
          auto.title = false; auto.criteria = false; auto.org = false;
        } else if (el.mtype.value === AWARD) {
          // 공적심사위원회로 고른 상태에서 일반 회의록을 불러오면, 불러온 안건으로 의결서를 새로 만듭니다.
          syncAward(true);
        }
        tbody.innerHTML = '';
        r.members.forEach((x) => addRow({ role: x.role, position: x.position, name: x.name }));
        toast('불러왔습니다');
      } catch (e) { if (!handleAuthError(e)) showError('#m', e); }
    });

    const collect = () => ({
      meeting: Object.assign({ id: id || '', type: el.mtype.value === AWARD ? AWARD : '',
        award: el.mtype.value === AWARD ? collectAward() : null }, Object.fromEntries(
        ['title', 'datetime', 'place', 'committee', 'agenda', 'result', 'confirmDate', 'school'].map((k) => [k, form.elements[k].value]))),
      members: $all('tr', tbody).map((tr) => ({
        memberId: tr.dataset.memberId,
        role: $('[data-k=role]', tr).value, position: $('[data-k=position]', tr).value, name: $('[data-k=name]', tr).value,
      })),
    });

    $('#preview').addEventListener('click', () => {
      const d = collect();
      if (d.meeting.award) d.meeting.award.nominees = d.meeting.award.nominees.filter((n) => n.grade || n.org || n.position || n.name);
      modal(`<h2>미리보기</h2><div class="doc-frame"><div class="doc-stack">${renderDocs(d.meeting, d.members.filter((x) => x.name || x.role))}</div></div>
        <div class="row end"><button data-close>닫기</button></div>`, (back) => {
        back.querySelector('.modal').style.maxWidth = '900px';
      });
    });

    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const d = collect();
      if (d.meeting.type === AWARD && !d.meeting.award.title.trim()) {
        // 비어 있으면 안건에서 한 번 더 만들어 봅니다.
        el.a_title.value = awardTitleFrom(el.agenda.value);
        if (!el.a_criteria.value.trim()) el.a_criteria.value = awardCriteriaFrom(el.a_title.value.trim(), el.result.value);
        if (!el.a_title.value.trim()) {
          el.a_title.scrollIntoView({ block: 'center' });
          el.a_title.focus();
          return showError('#m', new Error('공적심사의결서 제목을 입력해 주세요. (위쪽 공적심사의결서 칸의 제목)'));
        }
        Object.assign(d.meeting.award, { title: el.a_title.value, criteria: el.a_criteria.value });
      }
      const left = ['datetime', 'place', 'agenda', 'result', 'confirmDate', 'school']
        .filter((k) => (d.meeting[k] || '').includes('○')).length
        + (d.meeting.award ? JSON.stringify(d.meeting.award).split('○').length - 1 : 0);
      if (left && !confirm('아직 고치지 않은 ○ 표시가 남아 있습니다. 그대로 저장할까요?')) return;
      const send = (confirmReset) => call('saveMeeting', Object.assign({ token: state.adminToken, confirmReset }, d));
      try {
        let r;
        try {
          r = await busy($('#save'), () => send(false));
        } catch (e) {
          if (e.code !== 'SIGNED_EXISTS') throw e;
          if (!confirm(e.message + '\n그래도 저장할까요?')) return;
          r = await busy($('#save'), () => send(true));
        }
        await adminDetail(r.id);
        if (r.issued.length) showIssued(r.id, r.issued);
        else toast(r.signaturesReset ? '저장했습니다. 서명이 초기화되었습니다.' : '저장했습니다');
      } catch (e) { if (!handleAuthError(e)) showError('#m', e); }
    });
  }

  /** 발급된 비밀번호 안내 (이 창을 닫으면 다시 볼 수 없음) */
  function showIssued(meetingId, issued) {
    const meeting = state.current ? state.current.meeting : { title: '회의록' };
    const texts = issued.map((x) => inviteText(meeting, x.name, memberLink(meetingId, x.memberId, x.code), x.password));
    modal(`
      <h2>위원 접속 비밀번호</h2>
      <div class="msg warn">비밀번호는 보안을 위해 지금만 보입니다. 창을 닫기 전에 각 위원께 전달하거나 복사해 두세요.
        잊어버리면 위원별 <b>비밀번호 재발급</b>으로 새로 만들 수 있습니다.</div>
      ${issued.map((x, i) => `
        <div style="margin-top:12px"><div class="row" style="justify-content:space-between">
          <b>${esc(x.name)}</b> <span class="pw">${esc(x.password)}</span>
          <button class="small" data-copy="${i}">안내문 복사</button></div>
          <pre class="copy">${esc(texts[i])}</pre></div>`).join('')}
      <div class="row end"><button id="copyAll">전체 복사</button><button class="primary" data-close>확인했습니다</button></div>`,
    (back) => {
      $all('[data-copy]', back).forEach((b) => b.addEventListener('click', () => copyText(texts[Number(b.dataset.copy)])));
      $('#copyAll', back).addEventListener('click', () => copyText(texts.join('\n\n')));
    });
  }

  /** 불참 처리 창: '불참' 또는 사유(출장·연수 등)를 고르거나 직접 입력합니다. 서명 칸에 그대로 들어갑니다. */
  function absenceDialog(mem, onSave) {
    const chips = ['불참', '출장', '연수', '병가', '연가', '공가'];
    modal(`
      <h2>${esc(mem.name)} 위원 불참 처리</h2>

          await busy(b, () => call('resetSignature', { token: state.adminToken, meetingId: id, memberId: mid }));

        }
      } catch (err) { if (!handleAuthError(err)) alert(err.message); }
    }));

  /**
   * 출력용 HTML. 회의록 1쪽이 A4 한 장(여백 15mm 안: 180 x 267mm)에 들어가도록
   * 실제로 그려 높이를 재고, 넘치면 줄간격·글자·칸 높이를 단계적으로 줄입니다(fit1~fit3).
   * 그래도 넘치면 서명 블록이 통째로 다음 쪽으로 넘어갑니다.
   */
  function buildPrintHtml(r, withAudit) {
    const footer = `문서번호 ${r.meeting.id.slice(0, 12)} · 문서 확인값 ${r.docHash.slice(0, 16)}`;
    const opts = { showSignatures: true, footer };
    // 공적심사위원회는 공적심사의결서가 회의록 바로 앞 쪽에 들어갑니다.
    return (r.meeting.type === AWARD ? fitPage(renderAward(r.meeting, r.members, opts)) : '')
      + fitPage(renderDoc(r.meeting, r.members, opts))
      + (withAudit ? renderAudit(r.meeting, r.members, r.docHash, r.logs) : '');
  }

  function fitPage(docHtml) {
    const box = document.createElement('div');
    box.className = 'print-root';
    box.style.cssText = 'position:absolute;left:-10000px;top:0;width:180mm;visibility:hidden';
    box.innerHTML = docHtml;
    document.body.appendChild(box);
    const doc = box.firstElementChild;
    const limit = 262 * 96 / 25.4; // 267mm에서 약간 여유
    for (const level of ['', 'fit1', 'fit2', 'fit3']) {
      doc.classList.remove('fit1', 'fit2', 'fit3');
      if (level) doc.classList.add(level);
      if (doc.scrollHeight <= limit) break;
    }
    const html = box.innerHTML;
    box.remove();
    return html;
  }

  /** 서버가 돌려준 파일 내용(base64)을 지정한 이름으로 PC에 내려받습니다. */
  function downloadBase64(name, b64) {
    const bin = atob(b64 || '');
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
    const a = document.createElement('a');
    a.href = url; a.download = name; a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
  }

  /** PDF 파일명(확장자 제외): 붙임-위원회 이름 회의록(저장 날짜 yyMMdd) */
  function pdfBaseName(m) {
    const d = new Date();
    const yymmdd = String(d.getFullYear() % 100).padStart(2, '0') + String(d.getMonth() + 1).padStart(2, '0')
      + String(d.getDate()).padStart(2, '0');
    const committee = String(m.committee || '').replace(/\s+/g, ' ').trim();
    return `붙임-${committee ? committee + ' 회의록' : (m.title || '회의록')}(${yymmdd})`.replace(/[\\/:*?"<>|]/g, '_');
  }

  function adminPrint(r) {
    const total = r.members.filter((x) => !x.absence || x.signedAt).length;
    const signed = r.members.filter((x) => x.signedAt).length;
    modal(`
      <h2>PDF 출력</h2>
      ${signed < total ? `<div class="msg warn">아직 ${total - signed}명이 서명하지 않았습니다. 빈칸으로 출력됩니다.
        회의에 오지 않은 위원은 <b>불참 처리</b>를 하면 서명 칸에 '불참'이 들어갑니다.</div>` : ''}
      <label class="check"><input type="checkbox" id="audit" checked> 전자서명 확인 내역(서명 일시·문서 확인값) 페이지 포함</label>
      <p class="muted">• <b>구글 드라이브에 저장 (원본)</b>: 드라이브의 '회의록 전자서명 PDF' 폴더에 저장하고 파일 확인값을 기록합니다.
        저장 후 나오는 <b>PC에 내려받기</b>로 같은 파일을 <b>'붙임-○○위원회 회의록(날짜).pdf'</b> 이름으로 바로 받을 수 있습니다.
        <b>위변조 확인</b>이 되는 원본이라 에듀파인 첨부용으로 권장합니다.<br>
      • <b>인쇄</b>: 종이로 인쇄할 때 씁니다.</p>
      <div id="pm" class="hidden"></div>
      <div class="row end">
        <button data-close>닫기</button>
        <button id="doPrint">인쇄</button>
        <button class="primary" id="drive">구글 드라이브에 저장 (원본)</button>
      </div>`, (back, close) => {
      $('#doPrint', back).addEventListener('click', () => {
        const area = $('#print-area');
        area.className = 'print-root';
        area.innerHTML = buildPrintHtml(r, $('#audit', back).checked);
        close();
        const imgs = $all('img', area);
        Promise.all(imgs.map((img) => img.complete ? 0 : new Promise((ok) => { img.onload = img.onerror = ok; })))
          .then(() => (document.fonts ? document.fonts.ready : 0))
          .then(() => setTimeout(() => {
            // 'PDF로 저장' 파일명은 페이지 제목을 따릅니다: 붙임-인사관리위원회 회의록(261120)
            const oldTitle = document.title;
            document.title = pdfBaseName(r.meeting);
            const restore = () => { document.title = oldTitle; window.removeEventListener('afterprint', restore); };
            window.addEventListener('afterprint', restore);
            window.print();
            setTimeout(restore, 1000);
          }, 50));
      });
      $('#drive', back).addEventListener('click', async (e) => {
        const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><style>${$('#doc-css').textContent}
          body{margin:0}
          /* 구글의 PDF 변환은 쪽 너비에 꽉 찬 표의 오른쪽 테두리를 잘라 먹으므로 표를 아주 조금 좁힙니다. */
          .print-root .doc table{width:99.4%}</style></head>
          <body><div class="print-root">${buildPrintHtml(r, $('#audit', back).checked)}</div></body></html>`;
        try {
          const res = await busy(e.currentTarget, () => call('savePdf', { token: state.adminToken, meetingId: r.meeting.id, html }));
          const pm = $('#pm', back);
          pm.className = 'msg ok';
          pm.innerHTML = `원본 PDF를 저장했습니다: <a href="${esc(res.url)}" target="_blank" rel="noopener">${esc(res.name)}</a>
            <div style="margin:8px 0"><button type="button" class="primary" id="dl">PC에 내려받기</button></div>
            <div>PC에 받은 파일을 에듀파인에 첨부하세요. (내려받기가 안 되면 위 링크를 열어 드라이브에서 다운로드하세요.)
              등록을 마치면 회의록 화면의 <b>클라우드 데이터 파기</b>로 구글에서 지울 수 있습니다.</div>
            <div class="muted" style="word-break:break-all">파일 확인값 ${esc(res.sha256)}</div>`;
          $('#dl', pm).addEventListener('click', () => downloadBase64(res.name, res.data));
        } catch (err) { if (!handleAuthError(err)) showError($('#pm', back), err); }
      });
    });
  }

            ${fixed ? `<p>안녕하세요, <b>${esc(fixed.name)}</b> 위원님.</p>` : `
            <label class="f"><span>성명</span><select id="who" required><option value="">본인 성명을 선택하세요</option>
              ${pub.members.map((x) => `<option value="${esc(x.memberId)}">${esc(x.name)} (${esc(x.role)})</option>`).join('')}</select></label>`}
            <label class="f"><span>비밀번호 (담당자에게 받은 6자리)</span>
              <input type="password" id="pw" inputmode="numeric" autocomplete="one-time-code" required></label>
            <div id="m" class="hidden"></div>
            <button class="primary" style="width:100%">회의록 확인하기</button>
          </form>
        </div>
      </div>`;
    (fixed ? $('#pw') : $('#who')).focus();
    $('#f').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const memberId = fixed ? fixed.memberId : $('#who').value;
      try {
        const r = await busy($('#f button'), () => call('memberLogin', { meetingId: P.m, memberId, password: $('#pw').value, device: deviceInfo() }));
        state.member = r;
        // 키보드를 닫고 화면 위치를 처음으로 돌린 뒤 회의록을 그립니다(휴대폰에서 터치 위치가 어긋나지 않게).
        if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
        memberView();
        window.scrollTo(0, 0);
      } catch (e) { showError('#m', e); }
    });
  }

  function memberView() {
    const r = state.member;
    const m = r.meeting;
    const done = !!r.me.signedAt;
    const closed = m.status === 'closed' || (!done && !!r.me.absence);
    const isAward = m.type === AWARD;
    const membersForDoc = r.members.map((x) => x.memberId === r.me.memberId
      ? Object.assign({}, x, { signature: r.me.signature, vote: r.me.vote }) : x);
    app.innerHTML = `
      <div class="wrap">
        <header class="top"><h1>${esc(m.title)}</h1><span class="muted">${esc(r.me.name)} 위원</span></header>
        ${done ? `<div class="msg ok">서명을 마쳤습니다 (${esc(r.me.signedAt)}). 감사합니다. 이 창은 닫으셔도 됩니다.</div>`
          : r.me.absence ? ''
          : isAward ? '<div class="msg warn">아래 <b>공적심사의결서</b>와 <b>회의록</b>을 확인하신 뒤, 맨 아래에서 가/부를 고르고 서명해 주세요.</div>'
          : '<div class="msg warn">아래 회의록 내용을 확인하신 뒤, 맨 아래에서 서명하고 <b>동의</b>를 눌러 주세요.</div>'}
        <div class="row end" style="margin-bottom:6px"><button type="button" class="small" id="zoom">${state.zoom ? '화면에 맞추기' : '크게 보기'}</button></div>
        <div class="doc-frame" id="docFrame"><div class="doc-stack">${renderDocs(m, membersForDoc, { mySignatureId: r.me.memberId, markSigned: true })}</div></div>
        ${done || closed ? (closed && !done ? `<div class="msg warn">${r.me.absence
          ? `${esc(r.me.absence)}(으)로 처리되어 서명할 수 없습니다. 담당자에게 문의해 주세요.` : '서명이 마감되었습니다.'}</div>` : '') : `
        <div class="card" id="signCard">
          <h2>확인 서명</h2>
          ${isAward ? `
          <div class="vote-box"><b>공적심사 의결</b>
            <div class="vote-opts">
              <label class="vote-opt"><input type="radio" name="vote" value="가"> 가 (찬성)</label>
              <label class="vote-opt"><input type="radio" name="vote" value="부"> 부 (반대)</label>
            </div>
          </div>` : ''}
          <p class="muted" style="${isAward ? 'margin-top:12px' : 'margin-top:-6px'}">아래 칸에 손가락이나 마우스로 서명하세요.${isAward
            ? ' 한 번 서명하면 <b>공적심사의결서</b>와 <b>회의록</b>에 함께 들어갑니다.' : ''}</p>
          <div class="sigpad-wrap"><canvas id="pad"></canvas><div class="sigpad-hint" id="hint">여기에 서명하세요</div></div>
          <div class="row" style="margin-top:8px">
            <button type="button" class="small" id="clear">지우기</button>
          </div>
          <label class="check"><input type="checkbox" id="agree">
            <span>위 ${isAward ? '공적심사의결서와 회의록의' : '회의록의'} 내용을 확인하였으며, 이에 동의하고 서명합니다.</span></label>
          <label class="check"><input type="checkbox" id="esign">
            <span>이 전자서명을 자필 서명과 같은 서명으로 사용하는 데 동의합니다.
            <span class="muted" style="display:block;font-weight:400">「전자서명법」 제3조에 따라, 동의한 전자서명은 서명·기명날인과 같은 효력을 가집니다.
            서명 일시와 접속 기기 정보가 서명 기록으로 함께 보관됩니다.</span></span></label>
          <div id="m" class="hidden"></div>
          <button class="primary" id="sign" style="width:100%;padding:13px">동의하고 서명하기</button>
        </div>`}
      </div>`;
    fitDoc();
    window.addEventListener('resize', fitDoc);
    $('#zoom').addEventListener('click', (e) => {
      state.zoom = !state.zoom;
      e.currentTarget.textContent = state.zoom ? '화면에 맞추기' : '크게 보기';
      fitDoc();
    });
    if (done || closed) return;

    const clearMsg = () => { const b = $('#m'); if (b) { b.className = 'hidden'; b.textContent = ''; } };
    $all('[name=vote]').forEach((x) => x.addEventListener('change', clearMsg));
    const pad = createPad($('#pad'), () => { $('#hint').classList.add('hidden'); clearMsg(); });
    // 회의록이 그려지고 화면이 길어진 뒤 배치를 다시 계산합니다(글꼴 로딩 뒤에도 한 번 더).
    setTimeout(nudgeLayout, 300);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => setTimeout(nudgeLayout, 100));
    $('#clear').addEventListener('click', () => { pad.clear(); $('#hint').classList.remove('hidden'); });
    $('#sign').addEventListener('click', async (e) => {
      const voteEl = $('[name=vote]:checked');
      if (isAward && !voteEl) return showError('#m', new Error('공적심사 의결(가/부)을 골라 주세요.'));
      if (pad.isEmpty()) return showError('#m', new Error('서명 칸에 서명해 주세요.'));
      if (!$('#agree').checked) return showError('#m', new Error('내용 확인 및 동의에 체크해 주세요.'));
      if (!$('#esign').checked) return showError('#m', new Error('전자서명 사용 동의에 체크해 주세요.'));
      const signature = pad.export();
      try {
        const res = await busy(e.currentTarget, () => call('memberSign', { token: r.token, signature, docHash: r.docHash, consentEsign: true,
          vote: voteEl ? voteEl.value : '', device: deviceInfo() }));
        state.member = Object.assign({ token: r.token }, res);
        memberView();
        window.scrollTo(0, 0);
      } catch (err) {
        if (err.code === 'AUTH') { alert(err.message); memberStart(); return; }
        showError('#m', err);
      }
    });
  }

  /** 휴대폰 화면에서 A4 회의록이 화면 폭에 맞게 보이도록 축소 */
  function fitDoc() {
    const frame = $('#docFrame');
    if (!frame) return;
    const doc = $('.doc-stack', frame) || $('.doc', frame);
    doc.style.transform = '';
    doc.style.transformOrigin = 'top left';
    frame.style.height = '';
    frame.style.overflow = '';
    if (state.zoom) { doc.style.margin = ''; frame.style.overflowX = 'auto'; return; }
    const avail = frame.clientWidth - 40;
    const w = doc.offsetWidth;
    if (w > avail) {
      const s = avail / w;
      doc.style.transform = `scale(${s})`;
      doc.style.margin = '0';
      frame.style.height = (doc.offsetHeight * s + 40) + 'px';
      frame.style.overflow = 'hidden';
    }
  }

  // ───── 서명 패드 ─────
  function createPad(canvas, onDraw) {
    const ctx = canvas.getContext('2d');
    let empty = true;
    let drawing = false;
    let last = null;
    let ratio = 1;

    function resize() {
      const rect = canvas.getBoundingClientRect();
      if (rect.width < 2 || rect.height < 2) return; // 아직 화면에 자리 잡기 전이면 다음 기회에
      ratio = Math.max(window.devicePixelRatio || 1, 1);
      const w = Math.round(rect.width * ratio); const h = Math.round(rect.height * ratio);
      if (canvas.width === w && canvas.height === h) { applyStyle(); return; }
      const keep = empty ? null : canvas.toDataURL();
      canvas.width = w;
      canvas.height = h;
      applyStyle();
      if (keep) {
        const img = new Image();
        img.onload = () => { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(img, 0, 0, canvas.width, canvas.height); ctx.restore(); };
        img.src = keep;
      }
    }
    function applyStyle() {
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111';
    }
    resize();
    window.addEventListener('resize', resize);
    // 구글 웹 앱 화면(iframe)은 불러온 뒤에 크기가 바뀔 수 있어, 칸 크기가 바뀌면 바로 맞춥니다.
    if (window.ResizeObserver) new ResizeObserver(() => resize()).observe(canvas);
    // 화면을 내려 서명 칸이 보이는 순간에도 한 번 더 맞춥니다.
    if (window.IntersectionObserver) new IntersectionObserver((es) => {
      if (es.some((x) => x.isIntersecting)) { resize(); nudgeLayout(); }
    }).observe(canvas);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
    // 일부 휴대폰 브라우저에서 터치가 화면 스크롤로 넘어가지 않게 막습니다.
    ['touchstart', 'touchmove'].forEach((t) => canvas.addEventListener(t, (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false }));

    // 칸의 실제 크기와 그림 크기가 다르면 좌표를 그 비율로 맞춥니다(획이 엉뚱한 곳에 그려지거나 안 보이는 문제 방지).
    const pos = (e) => {
      const cw = canvas.clientWidth; const ch = canvas.clientHeight;
      const sx = cw ? canvas.width / ratio / cw : 1; const sy = ch ? canvas.height / ratio / ch : 1;
      // 브라우저가 계산한 칸 안의 위치(offsetX)를 우선 씁니다. 화면 확대·키보드로 화면 좌표가 어긋나도 정확합니다.
      if (e.target === canvas && typeof e.offsetX === 'number') return { x: e.offsetX * sx, y: e.offsetY * sy };
      const r = canvas.getBoundingClientRect();
      return { x: (e.clientX - r.left) * sx, y: (e.clientY - r.top) * sy };
    };
    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (empty) resize(); // 첫 획 전에 크기를 한 번 더 확인
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* 일부 브라우저 미지원 */ }
      drawing = true; last = pos(e);
      ctx.beginPath(); ctx.arc(last.x, last.y, 1.4, 0, Math.PI * 2); ctx.fillStyle = '#111'; ctx.fill();
      if (empty) { empty = false; onDraw && onDraw(); }
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!drawing) return;
      e.preventDefault();
      const p = pos(e);
      const w = e.pressure && e.pointerType === 'pen' ? 1.5 + e.pressure * 2.5 : 2.6;
      ctx.lineWidth = w;
      ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
      last = p;
    });
    const end = () => { drawing = false; };
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointercancel', end);

    return {
      isEmpty: () => empty,
      clear() { ctx.clearRect(0, 0, canvas.width, canvas.height); empty = true; },
      /** 서명 부분만 잘라 작은 PNG로 내보냅니다(시트 한 칸에 들어가는 크기). */
      export() {
        const { width, height } = canvas;
        const data = ctx.getImageData(0, 0, width, height).data;
        let minX = width, minY = height, maxX = -1, maxY = -1;
        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            if (data[(y * width + x) * 4 + 3] > 10) {
              if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y;
            }
          }
        }
        if (maxX < 0) return '';
        const pad = 6 * ratio;
        minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
        maxX = Math.min(width - 1, maxX + pad); maxY = Math.min(height - 1, maxY + pad);
        const sw = maxX - minX + 1; const sh = maxY - minY + 1;
        let scale = Math.min(1, 360 / sw, 140 / sh);
        let out = '';
        for (let i = 0; i < 5; i++) {
          const c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(sw * scale)); c.height = Math.max(1, Math.round(sh * scale));
          const cx = c.getContext('2d');
          cx.drawImage(canvas, minX, minY, sw, sh, 0, 0, c.width, c.height);
          out = c.toDataURL('image/png');
          if (out.length < 40000) break;
          scale *= 0.75;
        }
        return out;
      },
    };
  }

  start();
})();
</script>
</body>
</html>
